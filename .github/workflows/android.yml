name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install & copy web app into Android project
        run: |
          npm ci
          npm run sync

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PappVersionCode=${{ github.run_number }} -PappVersionName=1.0.${{ github.run_number }}
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/ModelForge-v1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ModelForge-apk
          path: ModelForge-*.apk

      - name: Publish GitHub Release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" ModelForge-v1.0.${{ github.run_number }}.apk \
            --title "Model Forge v1.0.${{ github.run_number }}" \
            --notes "Android APK built from ${GITHUB_SHA::7}. Download the .apk below on your phone and open it to install (allow 'Install unknown apps' if asked)." \
            --latest
